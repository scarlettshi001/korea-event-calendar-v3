name: Update Korea Events

on:
  schedule:
    - cron: "20 1 */2 * *"   # 每两天 10:20 KST（GitHub Actions 使用 UTC）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run update
      - name: Commit updates
        run: |
          git config user.name "event-radar-bot"
          git config user.email "event-radar-bot@users.noreply.github.com"
          git add data/events.json data/meta.json data/title_translations.json
          git diff --cached --quiet || git commit -m "chore: update Korea events"
          git push
